<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<title>Gallery — Lovegods in Leisure Suits</title>
	<meta name="author" content="Lovegods in Leisure Suits">

	<th:block th:replace="~{layouts/main :: headtags}"></th:block>
</head>

<body>

	<th:block th:replace="~{layouts/main :: header}"></th:block>

	<main>
		<div class="container">
			<h1>Gallery</h1>

			<div class="gallery-tabs" role="tablist" aria-label="Gallery eras">
				<button class="gallery-tab is-active"
						id="tab-reunion"
						role="tab"
						aria-selected="true"
						aria-controls="panel-reunion"
						data-panel="reunion">
					<span class="gallery-tab-year">2026</span>
					<span class="gallery-tab-label">Reunion</span>
				</button>
				<button class="gallery-tab"
						id="tab-classic"
						role="tab"
						aria-selected="false"
						tabindex="-1"
						aria-controls="panel-classic"
						data-panel="classic">
					<span class="gallery-tab-year">1987&ndash;1992</span>
					<span class="gallery-tab-label">Classic</span>
				</button>
			</div>

			<section class="gallery-panel is-active"
					 id="panel-reunion"
					 role="tabpanel"
					 aria-labelledby="tab-reunion">
				<div class="gallery-grid">
					<button class="gallery-thumb"
							th:each="image : ${reunionImages}"
							th:data-src="${image.src}"
							th:data-alt="${image.alt}"
							th:aria-label="|View full size: ${image.alt}|">
						<img th:src="${image.thumb}" th:alt="${image.alt}" loading="lazy">
					</button>
				</div>
			</section>

			<section class="gallery-panel"
					 id="panel-classic"
					 role="tabpanel"
					 aria-labelledby="tab-classic"
					 hidden>
				<div class="gallery-grid">
					<button class="gallery-thumb"
							th:each="image : ${classicImages}"
							th:data-src="${image.src}"
							th:data-alt="${image.alt}"
							th:aria-label="|View full size: ${image.alt}|">
						<img th:src="${image.thumb}" th:alt="${image.alt}" loading="lazy">
					</button>
				</div>
			</section>
		</div>
	</main>

	<!-- Lightbox -->
	<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer" aria-hidden="true">
		<button class="lightbox-close" id="lightbox-close" aria-label="Close photo viewer">&#x2715;</button>
		<button class="lightbox-btn lightbox-prev" id="lightbox-prev" aria-label="Previous photo">&#8249;</button>
		<div class="lightbox-img-wrap">
			<img class="lightbox-img" id="lightbox-img" src="" alt="">
		</div>
		<button class="lightbox-btn lightbox-next" id="lightbox-next" aria-label="Next photo">&#8250;</button>
		<span class="lightbox-counter" id="lightbox-counter" aria-live="polite"></span>
	</div>

	<th:block th:replace="~{layouts/main :: footer}"></th:block>

	<script th:src="@{/js/gallery.js}"></script>

</body>
</html>
